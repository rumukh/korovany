name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Pull-request runs group by ref so a new push supersedes the previous run.
  # Pushes to main get a unique group instead: with a shared group the default
  # queue is `single`, so a third push cancels the *pending* second run and a
  # main commit silently never gets a verdict.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    name: Build, lint, test, facts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The prose sweep diffs the PR against its base SHA. A shallow clone
          # does not contain that commit, and `git diff <missing>...HEAD` fails
          # rather than reporting nothing — which the sweep treats as a failure,
          # correctly, but for the environment instead of the tree.
          fetch-depth: 0

      # Keep in step with .github/workflows/deploy-pages.yml, which builds
      # the artifact that actually ships. If one moves, move both.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc -b, tsc --noEmit -p tsconfig.test.json, vite build)
        run: npm run build

      - name: Lint (oxlint)
        run: npm run lint

      - name: Test (node --test)
        run: npm test

      - name: Fact preservation check (scripts/strategy-facts.mjs)
        run: npm run docs:facts

      # The verification instrument's own controls. `npm run verify` needs a
      # remote and `gh`; `--mutate` is pure and repo-local. It runs both halves:
      # every control's live assertion, and its mutation. Running only the
      # mutations was a measured defect — a reviewer stubbed `sweepBounds` to a
      # constant and this step stayed green while four controls were failing
      # their real assertions, because a corruption where both the check and its
      # mutation are false is invisible to the negated expectations alone.
      - name: Verification controls (scripts/verify.mjs --mutate)
        run: npm run verify:mutate

      # The prose sweep, gated. A reviewer measured the gap it closes: the
      # controls above got a trigger and the sweep did not, so the class that
      # took four review rounds to characterise — double spaces outside inline
      # code, over-long lines, unterminated fences, a partition that drops rows
      # — was guarded only by a command someone had to remember to type.
      #
      # `--base` takes the SHA the runner already has, so this needs no `gh`,
      # no remote resolution and no network. Pull requests only: `base.sha`
      # does not exist on a push.
      #
      # Delegates to package.json like every other step. The first version of
      # this line restated `node scripts/verify.mjs --sweep-only` — the only
      # invocation in the repository that did — which is the defect the script
      # it calls fixed inside itself and documents in a comment two functions
      # above the one this runs. A flag that later becomes required would reach
      # `npm run verify` and not this step, silently, with the step still green.
      - name: Prose sweep (npm run verify:sweep)
        if: github.event_name == 'pull_request'
        run: npm run verify:sweep -- --base=${{ github.event.pull_request.base.sha }}
