name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Pull-request runs group by ref so a new push supersedes the previous run.
  # Pushes to main get a unique group instead: with a shared group the default
  # queue is `single`, so a third push cancels the *pending* second run and a
  # main commit silently never gets a verdict.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    name: Build, lint, test, facts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Keep in step with .github/workflows/deploy-pages.yml, which builds
      # the artifact that actually ships. If one moves, move both.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc -b, tsc --noEmit -p tsconfig.test.json, vite build)
        run: npm run build

      - name: Lint (oxlint)
        run: npm run lint

      - name: Test (node --test)
        run: npm test

      - name: Fact preservation check (scripts/strategy-facts.mjs)
        run: npm run docs:facts

      # The verification instrument's own controls, mutation-tested. `npm run
      # verify` needs a remote and `gh`; `--mutate` is pure and repo-local, and
      # it is the half that matters here: it asserts every control in
      # scripts/verify.mjs goes red under a corrupted instrument. A gate-reading
      # filter that cannot report a failure is the defect this script exists for,
      # and until this step existed there was nothing for CI to check.
      - name: Verification controls (scripts/verify.mjs --mutate)
        run: npm run verify:mutate
