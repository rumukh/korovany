name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # A deployment must be allowed to finish. Cancelling `actions/deploy-pages`
  # mid-flight can leave the live site on an older commit, and the run that would
  # explain it reads `cancelled` rather than `failure` — a stale site with nothing
  # pointing at it. GitHub's Pages template sets this `false` for that reason.
  #
  # The shared `pages` group is deliberate, and so is the default `queue: single`,
  # which drops a pending run when a newer one arrives. That behaviour is a defect
  # in ci.yml — which owes a verdict to every commit, so it groups main pushes
  # uniquely — and is the behaviour we want here: main is linear, so a superseding
  # push contains the commit it displaces, and only the newest content is served.
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
