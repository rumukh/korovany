name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      # A superseded build is waste: main is linear, so a newer push contains the
      # commit it displaces and the artifact this job would upload is already stale.
      # Cancelling it was the behaviour before the flag was flipped workflow-wide,
      # and it was observed working four times on 2026-07-28 — runs 30355639257,
      # 30357016872, 30362159815 and 30392484430. Stated no more strongly than it was
      # measured: three of those were runner-assigned and died at `Install
      # dependencies` or `Build` after 16-28s; the fourth recorded zero steps at 9s,
      # cancelled before a runner was assigned. All four predate the flip to false.
      #
      # This group is deliberately NOT the deployment's. A single workflow-level
      # group cannot hold both rules, because the flag it carries is the same flag
      # for the build that should die and the deploy that must not.
      group: pages-build
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      # A deployment must be allowed to finish. Cancelling `actions/deploy-pages`
      # mid-flight can leave the live site on an older commit, and the run that would
      # explain it reads `cancelled` rather than `failure` — a stale site with nothing
      # pointing at it. GitHub's Pages template sets this `false` for that reason.
      #
      # In the four cancellations above this job recorded zero steps and a zero-second
      # duration, so the harm has never actually occurred here: those are `needs:`
      # cascades, not interrupted deployments. It is guarded because it is unobserved,
      # not because it is impossible — the previous configuration could have caused it
      # on any of those four and simply did not.
      #
      # The default `queue: single` is inherited and is the decision we want, stated
      # rather than assumed: when a deploy is in flight and two more arrive, the older
      # pending one is dropped. main is linear, so the survivor contains the commit it
      # displaces and only the newest content is ever served. The same scheduler
      # behaviour is a defect in ci.yml — which owes a verdict to every commit, so it
      # groups main pushes uniquely — and is correct here, where only the tip matters.
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
