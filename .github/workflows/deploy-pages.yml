name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# There is deliberately no workflow-level `concurrency:` here. One group covering
# the whole run protected the deployment and paid for it with the build: GitHub
# holds a queued run in the same group `pending` before any job starts, so run N+1
# waited for run N to finish end to end and a superseded build could never be
# abandoned. Every cancellation in this repository's history killed a build; none
# interrupted a deployment. The two jobs want opposite policies, so they get one
# group each — the level at which GitHub lets them differ.

jobs:
  build:
    runs-on: ubuntu-latest
    # A superseded build has nothing worth finishing. Its artifact would be
    # replaced by the newer run's before anything served it, so cancelling it
    # costs a discarded artifact and saves the runner minutes.
    concurrency:
      group: pages-build
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # A deployment must be allowed to finish. Cancelling `actions/deploy-pages`
    # mid-flight can leave the live site on an older commit, and the run that
    # would explain it reads `cancelled` rather than `failure` — a stale site
    # with nothing pointing at it. GitHub's Pages template sets this `false` for
    # that reason, and the flag is spelled out rather than left to the default so
    # that deleting it is a visible edit.
    #
    # The default `queue: single` is also deliberate. It drops a pending run when
    # a newer one arrives, which is a defect in ci.yml — that workflow owes a
    # verdict to every commit, so it groups main pushes uniquely — and is the
    # behaviour we want here: main is linear, so a superseding push contains the
    # commit it displaces, and only the newest content is ever served.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
