name: Deploy GitHub Pages

# `workflow_dispatch` is what makes the build group below an expression rather than
# a name. A manual run picks its own ref — "this trigger only receives events when
# the workflow file is on the default branch", but the run itself is started against
# a chosen branch or tag — so a constant cancelling group would let a manual run on
# a months-old ref cancel the build of the newest commit on main. The group is keyed
# by event and ref for that reason, and the two keys are pinned by a test.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# There is deliberately no workflow-level `concurrency:` here. One group covering
# the whole run protected the deployment and paid for it with the build: GitHub
# documents that "when a concurrent job or workflow is queued, if another job or
# workflow using the same concurrency group in the repository is in progress, the
# queued job or workflow will be `pending`". So run N+1 would not start its build
# while run N held the group — it would be held pending, and under the default
# `queue: single` a run N+2 would replace it there rather than queue behind it.
# Which of those two happens does not matter to the build: either way the build
# job has no in-progress peer to cancel, so a superseded build could never be
# abandoned. Every cancellation in this repository's recorded history killed a
# build; none is recorded as interrupting a deployment. The two jobs want opposite
# policies, so they get one group each — the level at which GitHub lets them
# differ.

jobs:
  build:
    runs-on: ubuntu-latest
    # A superseded build has nothing worth finishing. Its artifact would be
    # replaced by the newer run's before anything served it, so cancelling it
    # costs a discarded artifact and saves the runner minutes.
    #
    # The group is keyed by event and ref so that "superseded" means what it says.
    # Pushes to main all land in `pages-build-push-refs/heads/main` and supersede
    # one another, which is the whole point. A `workflow_dispatch` run lands in
    # `pages-build-workflow_dispatch-<its ref>`, so it can neither cancel a main
    # build nor be cancelled by one, and two manual runs of the same ref still
    # supersede each other. `github.event_name` and `github.ref` are both in the
    # `github` context, which is one of the contexts this key may reference.
    concurrency:
      group: pages-build-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # A deployment must be allowed to finish. What is documented is modest, and is
    # all that is claimed here: GitHub's Pages starter workflow sets this `false`
    # with the comment that production deployments should be allowed to complete.
    # The reason to care is an inference on top of that and is labelled as one — a
    # deployment interrupted part-way leaves the live site on whatever was last
    # published, and the run that would explain it reads `cancelled` rather than
    # `failure`, so nothing points at it. The flag is spelled out rather than left
    # to the default so that deleting it is a visible edit.
    #
    # This group is a constant where the build's is not, because there is one live
    # site and every deployment competes for it. Keying it by ref would let a
    # manual run of an old ref publish alongside main instead of behind it.
    #
    # The documented default `queue: single` is kept, and it is a policy choice
    # rather than a proof: "at most one job or workflow run can be `pending` in the
    # concurrency group … any existing `pending` job or workflow run in the same
    # group is canceled and replaced". So a newer pending deploy displaces an older
    # pending one that would have worked, and if the newer one then fails the site
    # stays on whatever is already live — older than either. That is a real
    # availability-versus-freshness trade, accepted here because main is linear and
    # a superseding push contains the commit it displaces, so the displaced deploy
    # is redundant whenever the newer one succeeds. Ordering among waiting runs is
    # documented as best-effort in any case — "processed in first-in-first-out
    # (FIFO) order according to the time each one started waiting on the
    # concurrency group … ordering is not guaranteed" — so "the newest content is
    # served" is not a claim this configuration can make. `queue: max` would buy
    # the other side of the trade at the cost of a queue of stale deployments, and
    # cannot be combined with `cancel-in-progress: true` in any case. ci.yml makes
    # the opposite choice deliberately, because it owes a verdict to every commit
    # and a verdict is not superseded by a later one.
    #
    # `queue: single` is left implicit rather than spelled out, unlike the flag
    # below it. Writing it would restate a default for no behavioural gain while
    # adding a key to a workflow that must not fail validation; the reasoning is
    # recorded here and in the guard instead.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
